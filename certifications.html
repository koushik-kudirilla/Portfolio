<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certifications & Credentials — Koushik Kudirilla</title>
<meta name="description" content="Verified courses and certifications that complement my technical work.">
<meta name="theme-color" content="#0B0E10">
<link rel="icon" href="assets/favicon/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<style id="koushik-certification-isolated-css">
/* ================================================================
   CERTIFICATIONS — isolated PDF preview system
   No certification preview rules are shared with the global CSS.
   Exactly one scroll container exists inside each long preview.
   ================================================================ */
#cert-grid .kk-cert-preview {
  position:relative !important;
  width:100% !important;
  height:292px !important;
  min-height:292px !important;
  max-height:292px !important;
  margin:0 !important;
  padding:0 !important;
  overflow:hidden !important;
  box-sizing:border-box !important;
  background:#fff !important;
  border-radius:0 !important;
  isolation:isolate;
}
#cert-grid .kk-cert-scroll {
  position:absolute !important;
  inset:0 !important;
  width:100% !important;
  height:100% !important;
  margin:0 !important;
  padding:0 !important;
  overflow-x:hidden !important;
  overflow-y:auto !important;
  box-sizing:border-box !important;
  scrollbar-width:none !important;
  -ms-overflow-style:none !important;
  overscroll-behavior-x:none !important;
  overscroll-behavior-y:auto !important;
  -webkit-overflow-scrolling:touch !important;
  touch-action:pan-y !important;
  background:#fff !important;
  z-index:1 !important;
}
#cert-grid .kk-cert-scroll::-webkit-scrollbar { width:0 !important; height:0 !important; }
#cert-grid .kk-cert-pages { width:100% !important; min-height:100% !important; margin:0 !important; padding:0 !important; }
#cert-grid .kk-cert-page { width:100% !important; margin:0 !important; padding:0 !important; display:block !important; line-height:0 !important; }
#cert-grid .kk-cert-page canvas { display:block !important; width:100% !important; height:auto !important; max-width:none !important; margin:0 !important; padding:0 !important; background:#fff !important; }

/* Fixed rail: it belongs to the preview, not the scrolling PDF content. */
#cert-grid .kk-cert-rail {
  position:absolute !important;
  top:8px !important;
  right:6px !important;
  bottom:8px !important;
  width:9px !important;
  border-radius:999px !important;
  background:rgba(20,28,31,.22) !important;
  z-index:10 !important;
  opacity:1 !important;
  pointer-events:auto !important;
  box-sizing:border-box !important;
}
#cert-grid .kk-cert-rail.hidden { display:none !important; }
#cert-grid .kk-cert-thumb {
  position:absolute !important;
  top:0 !important;
  left:0 !important;
  width:100% !important;
  min-height:38px !important;
  border-radius:999px !important;
  background:#61c9c3 !important;
  border:1px solid rgba(255,255,255,.25) !important;
  box-sizing:border-box !important;
  cursor:grab !important;
  touch-action:none !important;
  will-change:transform;
}
#cert-grid .kk-cert-thumb:active { cursor:grabbing !important; }

/* Single-page certificates: never show a scrollbar. */
#cert-grid .kk-cert-preview.single .kk-cert-scroll { overflow-y:hidden !important; }
#cert-grid .kk-cert-preview.single .kk-cert-rail { display:none !important; }

/* Keep the certificate cards themselves unchanged. */
#cert-grid .cert-card { overflow:hidden !important; }

@media (max-width:700px) {
  #cert-grid .kk-cert-preview { height:292px !important; min-height:292px !important; max-height:292px !important; }
}
</style>

</head><body data-theme="dark" data-page="certifications">
<a class="skip-link" href="#main-content">Skip to content</a>
<div id="site-nav"></div>
<main id="main-content"><section class="page-hero"><div class="container"><div class="section-head"><span class="section-kicker" id="page-kicker">Certifications</span><h1 id="page-title"></h1><p id="page-description"></p></div></div></section><section class="page-content"><div class="container"><div class="cert-grid reveal" id="cert-grid"></div></div></section></main>
<div id="site-footer"></div>
<div class="modal" id="resume-modal" aria-hidden="true"><div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="resume-modal-title"><div class="modal-head"><strong id="resume-modal-title">Resume Preview</strong><button class="modal-close" id="resume-close" type="button" aria-label="Close resume preview">×</button></div><div class="modal-viewer pdf-scroll" id="resume-viewer" aria-label="Resume document preview"></div><div class="modal-fallback">Prefer the original file? <a id="resume-open" href="assets/resume.pdf" target="_blank" rel="noopener noreferrer">Open resume</a> · <a href="assets/resume.pdf" download>Download</a></div></div></div>


<script src="data.js"></script><script>
(function () {
  "use strict";

  const PDFJS_SOURCES = [
    "assets/pdfjs/pdf.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",
    "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"
  ];
  let pdfJsPromise = null;

  const esc = (v) => String(v ?? "").replace(/[&<>\"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  function loadPdfJs() {
    if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
    if (pdfJsPromise) return pdfJsPromise;
    pdfJsPromise = new Promise((resolve, reject) => {
      let i = 0;
      const next = () => {
        if (i >= PDFJS_SOURCES.length) return reject(new Error("PDF.js unavailable"));
        const src = PDFJS_SOURCES[i++];
        const s = document.createElement("script");
        s.src = src;
        s.async = true;
        s.onload = () => {
          if (!window.pdfjsLib) return next();
          const base = src.replace(/\/build\/pdf\.min\.js$|\/pdf\.min\.js$/, "/");
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = base + "pdf.worker.min.js";
          resolve(window.pdfjsLib);
        };
        s.onerror = next;
        document.head.appendChild(s);
      };
      next();
    });
    return pdfJsPromise;
  }

  function makeCard(c) {
    const card = document.createElement("article");
    card.className = "cert-card";
    card.innerHTML = `
      <div class="kk-cert-preview" data-pdf="${esc(c.proofUrl || "")}"></div>
      <div class="cert-body">
        <div class="cert-heading">
          <span class="cert-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="9" r="5.5" stroke="currentColor" stroke-width="1.6"/><path d="m9.5 13.5-1 6 3.5-2 3.5 2-1-6M9.7 9l1.5 1.5L14.8 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <h3>${esc(c.name)}</h3>
        </div>
        ${c.course ? `<p class="cert-course">${esc(c.course)}</p>` : ""}
        <div class="cert-meta"><span class="cert-org">${esc(c.organization)}</span><span>${esc(c.date)}</span></div>
        ${c.score ? `<div class="cert-meta"><span>Score</span><span class="cert-score">${esc(c.score)}</span></div>` : ""}
        <div class="cert-proof-row">${c.proofUrl ? `<a class="chip-link chip-link-outline" href="${esc(c.proofUrl)}" target="_blank" rel="noopener noreferrer"><span>Open Certificate</span></a>` : ""}</div>
      </div>`;
    return card;
  }

  function isLong(c) {
    return /cambridge|b1 level|english certification/i.test(`${c.name || ""} ${c.course || ""} ${c.organization || ""}`) || /cambridge/i.test(c.proofUrl || "");
  }

  function setupRail(scroller, preview, rail, thumb) {
    let dragging = false;
    let startY = 0;
    let startScroll = 0;

    const sync = () => {
      const max = Math.max(0, scroller.scrollHeight - scroller.clientHeight);
      const track = Math.max(1, rail.clientHeight);
      if (max <= 1) {
        rail.classList.add("hidden");
        return;
      }
      rail.classList.remove("hidden");
      const thumbHeight = Math.max(38, Math.min(track, track * scroller.clientHeight / scroller.scrollHeight));
      thumb.style.height = `${thumbHeight}px`;
      const travel = Math.max(0, track - thumbHeight);
      thumb.style.transform = `translateY(${(scroller.scrollTop / max) * travel}px)`;
    };

    scroller.addEventListener("scroll", sync, {passive:true});
    window.addEventListener("resize", sync, {passive:true});

    thumb.addEventListener("pointerdown", e => {
      dragging = true;
      startY = e.clientY;
      startScroll = scroller.scrollTop;
      thumb.setPointerCapture?.(e.pointerId);
      e.preventDefault();
    });
    thumb.addEventListener("pointermove", e => {
      if (!dragging) return;
      const track = Math.max(1, rail.clientHeight - thumb.offsetHeight);
      const max = Math.max(0, scroller.scrollHeight - scroller.clientHeight);
      scroller.scrollTop = startScroll + ((e.clientY - startY) / track) * max;
      e.preventDefault();
    });
    thumb.addEventListener("pointerup", () => { dragging = false; });
    thumb.addEventListener("pointercancel", () => { dragging = false; });

    rail.addEventListener("pointerdown", e => {
      if (e.target === thumb) return;
      const rect = rail.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
      scroller.scrollTop = ratio * Math.max(0, scroller.scrollHeight - scroller.clientHeight);
    });

    new ResizeObserver(sync).observe(scroller);
    new ResizeObserver(sync).observe(preview);
    requestAnimationFrame(sync);
  }

  async function renderPreview(preview, url, longPdf) {
    preview.classList.add(longPdf ? "long" : "single");
    preview.innerHTML = "";

    const scroller = document.createElement("div");
    scroller.className = "kk-cert-scroll";
    const pages = document.createElement("div");
    pages.className = "kk-cert-pages";
    scroller.appendChild(pages);
    preview.appendChild(scroller);

    let rail, thumb;
    if (longPdf) {
      rail = document.createElement("div");
      rail.className = "kk-cert-rail hidden";
      thumb = document.createElement("span");
      thumb.className = "kk-cert-thumb";
      rail.appendChild(thumb);
      preview.appendChild(rail);
      setupRail(scroller, preview, rail, thumb);
    }

    try {
      const pdfjs = await loadPdfJs();
      const pdf = await pdfjs.getDocument({
        url: new URL(url, location.href).href,
        withCredentials: false,
        disableAutoFetch: false,
        disableStream: false
      }).promise;

      const count = longPdf ? pdf.numPages : 1;
      const basePage = await pdf.getPage(1);
      const baseViewport = basePage.getViewport({scale:1});
      const scale = Math.max(0.01, scroller.clientWidth / baseViewport.width);

      for (let n = 1; n <= count; n++) {
        const page = n === 1 ? basePage : await pdf.getPage(n);
        const vp = page.getViewport({scale});
        const wrap = document.createElement("div");
        wrap.className = "kk-cert-page";
        const canvas = document.createElement("canvas");
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.ceil(vp.width * dpr);
        canvas.height = Math.ceil(vp.height * dpr);
        canvas.style.width = `${vp.width}px`;
        canvas.style.height = `${vp.height}px`;
        wrap.appendChild(canvas);
        pages.appendChild(wrap);
        const ctx = canvas.getContext("2d", {alpha:false});
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        await page.render({canvasContext:ctx, viewport:vp}).promise;
      }
      scroller.scrollTop = 0;
      if (longPdf) requestAnimationFrame(() => requestAnimationFrame(() => thumb && thumb.parentElement && (() => {})()));
    } catch (err) {
      console.error("Certificate preview failed", err);
      const link = document.createElement("a");
      link.href = url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "Open Certificate";
      link.className = "chip-link chip-link-outline";
      preview.innerHTML = "";
      preview.appendChild(link);
    }
  }

  async function init() {
    const grid = document.getElementById("cert-grid");
    if (!grid || !window.PORTFOLIO_DATA) return;

    const data = window.PORTFOLIO_DATA;
    const copy = data.pageCopy?.certifications || {};
    document.getElementById("page-kicker").textContent = copy.kicker || "Certifications";
    document.getElementById("page-title").textContent = copy.title || "Certifications & credentials.";
    document.getElementById("page-description").textContent = copy.description || "Verified courses and certifications that complement my technical work.";

    grid.innerHTML = "";
    const cards = (data.certifications || []).map(makeCard);
    cards.forEach(card => grid.appendChild(card));

    /* Warm PDF.js immediately, but never put a loading overlay over a preview. */
    const pdfPromise = loadPdfJs().catch(() => null);
    await Promise.all(cards.map(async (card, i) => {
      const c = data.certifications[i];
      if (!c?.proofUrl) return;
      await pdfPromise;
      await renderPreview(card.querySelector(".kk-cert-preview"), c.proofUrl, isLong(c));
    }));

    /* The global nav/footer are loaded without loading script.js, so no shared
       certificate renderer can create a second scroll surface. */
    const navHost = document.getElementById("site-nav");
    const footerHost = document.getElementById("site-footer");
    try {
      if (navHost) navHost.innerHTML = await fetch("nav.html", {cache:"no-store"}).then(r => r.ok ? r.text() : "");
      if (footerHost) footerHost.innerHTML = await fetch("footer.html", {cache:"no-store"}).then(r => r.ok ? r.text() : "");
    } catch (_) {}
    const year = document.getElementById("footer-year");
    if (year) year.textContent = new Date().getFullYear();
    document.querySelectorAll('#nav-links [data-nav="certifications"]').forEach(a => a.classList.add("active"));

    const theme = localStorage.getItem("portfolio-theme");
    if (theme === "light") document.body.setAttribute("data-theme", "light");
    document.getElementById("theme-toggle")?.addEventListener("click", () => {
      const light = document.body.getAttribute("data-theme") === "light";
      document.body.setAttribute("data-theme", light ? "dark" : "light");
      localStorage.setItem("portfolio-theme", light ? "dark" : "light");
    });
    const menu = document.getElementById("menu-toggle");
    const links = document.getElementById("nav-links");
    menu?.addEventListener("click", () => {
      const open = menu.getAttribute("aria-expanded") === "true";
      menu.setAttribute("aria-expanded", String(!open));
      links?.classList.toggle("open", !open);
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init, {once:true});
  else init();
})();
</script>
</body></html>
